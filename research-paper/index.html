<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Research Paper</title>
  <style>
    :root{
      --bg:#0b1024;
      --panel:#111733;
      --border:#1f2947;
      --text:#e5e7eb;
      --muted:#a7b0c3;
      --accent:#ffd089;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;min-height:100vh;padding:32px 18px;display:flex;justify-content:center}
    .panel{max-width:900px;width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:24px 22px;box-shadow:0 10px 28px rgba(0,0,0,.35)}
    h1{font-size:clamp(1.8rem,3vw,2.3rem);margin-bottom:.35rem;letter-spacing:-.01em}
    .meta{color:var(--muted);margin-bottom:1rem}
    .link{display:inline-flex;align-items:center;gap:.4rem;margin-top:.6rem;color:var(--accent);text-decoration:none;font-weight:600}
    .link:hover{text-decoration:underline}
    .embed{margin-top:1.1rem;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#0f172a;min-height:70vh}
    object{width:100%;height:100%;min-height:70vh;border:0}
    p{margin-bottom:.6rem;font-size:1rem;color:var(--text)}
  </style>
</head>
<body>
  <main class="panel">
    <h1>Research Paper</h1>
    <p class="meta">PDF · Full text</p>
    <p>Read the paper below or download it directly. If the embedded viewer does not load, use the download link.</p>
    <a class="link" href="./Final_Paper.pdf" target="_blank" rel="noopener">Download PDF</a>
    <div class="embed">
      <object data="./Final_Paper.pdf" type="application/pdf">
        <p>PDF preview unavailable. <a class="link" href="./Final_Paper.pdf" target="_blank" rel="noopener">Open the PDF</a>.</p>
      </object>
    </div>
  </main>
</body>
</html>
